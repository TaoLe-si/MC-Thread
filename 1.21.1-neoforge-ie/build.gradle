plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The Thread Tearer core (provides the API + interaction/apply mixin
    // surface). Compiled and consumed via mavenLocal.
    implementation "com.taolesi.threadtearer:threadtearer:${threadtearer_version}"

    // Immersive Engineering jar used as compileOnly so the mixins can
    // reference IEBaseBlockEntity (the shared base every IEServerTickableBE
    // walks up to) and IEServerTickableBE (the single chokepoint interface).
    // The three BE classes in IeOffloadPolicy.ALLOWED are matched by string
    // FQCN at runtime via Mixin's `targets =` resolution, so no IE symbol is
    // needed at compile time beyond the shared base. Runtime comes from the
    // user's installed copy via the deps declared in neoforge.mods.toml.
    compileOnly files(ie_compile_jar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Mixin package hygiene and @WrapOperation target verification, run before
// anything compiles. Both catch failures that would otherwise only appear in
// game: an undeclared class in a mixin package crashes the moment its mixin
// applies, and a stale ordinal silently wraps the wrong call. Skipped when
// python is unavailable so a machine without it can still build.
def pythonAvailable = providers.exec {
    commandLine 'python', '--version'
    ignoreExitValue = true
}.result.map { it.exitValue == 0 }
var verifyMixins = tasks.register('verifyMixins', Exec) {
    group = 'verification'
    description = 'Checks that no undeclared class sits in a mixin package'
    commandLine 'python', 'tools/verify_mixin_packages.py'
    onlyIf { pythonAvailable.get() }
}
var verifyMixinTargets = tasks.register('verifyMixinTargets', Exec) {
    group = 'verification'
    description = 'Checks @WrapOperation targets against the installed IE jar'
    commandLine 'python', 'tools/verify_mixin_targets.py'
    onlyIf { pythonAvailable.get() }
}
tasks.named('compileJava').configure { dependsOn verifyMixins, verifyMixinTargets }

tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': "${mod_id}.mixins.json")
    }
}

tasks.register('copyToMods', Copy) {
    group = 'modpack'
    description = 'Copies the built jar into a game mods folder (-PmodsDir=...)'
    dependsOn 'jar'
    from layout.buildDirectory.dir('libs')
    include '*.jar'
    def dir = providers.gradleProperty('modsDir')
    into dir
    onlyIf { dir.isPresent() }
}