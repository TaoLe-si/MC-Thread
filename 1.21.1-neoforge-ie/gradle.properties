# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Java 21 toolchain (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Environment (matches the parent Thread Tearer build)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

## Mod properties

mod_id=threadtearer_ie
mod_name=Thread Tearer — Immersive Engineering
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.taolesi.threadtearer.ie
mod_authors=TaoLe-si
mod_description=Addon for Thread Tearer: relocates three Immersive Engineering block-entity ticks (Charging Station, Sample Drill, Cloche) onto the Thread Tearer compute pool. Requires Thread Tearer 0.3.0+ and Immersive Engineering 12.4.x for 1.21.1.

# The Thread Tearer core to depend on (consumed via mavenLocal).
threadtearer_version=0.3.0

# Immersive Engineering jars used as compileOnly so the mixins can reference
# IEBaseBlockEntity (the shared base every IEServerTickableBE walks up to) and
# IEServerTickableBE (the single chokepoint interface). The three BE classes in
# the allowlist themselves are matched by string FQCN at runtime via Mixin's
# `targets =` resolution, so no IE symbol is needed at compile time beyond
# the shared base. Runtime comes from the user's installed copy via the deps
# declared in neoforge.mods.toml. The path points at the user's installed
# 12.4.3 jar (the addon's source link is github.com/BluSunrize/
# ImmersiveEngineering branch 1.21.1).
ie_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/ImmersiveEngineering-1.21.1-12.4.2-194.jar