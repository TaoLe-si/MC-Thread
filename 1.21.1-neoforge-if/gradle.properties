# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Java 21 toolchain (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Environment (matches the parent Thread Tearer build)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

## Mod properties

mod_id=threadtearer_if
mod_name=Thread Tearer — IF
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.taolesi.threadtearer.industrial
mod_authors=TaoLe-si
mod_description=Addon for Thread Tearer: relocates Industrial Foregoing machine block-entity ticks onto the Thread Tearer compute pool. Requires Thread Tearer 0.3.0+ and Industrial Foregoing 1.21.x.

# The Thread Tearer core to depend on (consumed via mavenLocal).
threadtearer_version=0.3.0

# Industrial Foregoing jar used as compileOnly so the mixins can name IF
# types they wrap. The jar on disk is not bundled at runtime — it is only
# on the compile classpath. Runtime comes from the user's installed IF mod.
if_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/industrialforegoing-1.21-3.6.39.jar

# Titanium jar (IF's framework) used as compileOnly so
# LaserDrillDeferralMixin can call ProgressBarComponent.getComponentHarness()
# for its deferral lock. Same pattern as if_compile_jar: compile-time only.
titanium_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/titanium-1.21-4.0.45.jar