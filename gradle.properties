# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Java 21 toolchain used by ModDevGradle artifact creation (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Parchment mappings (parameter names + javadoc), see https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.21)
# NeoForge 1.20.1 is Forge-compatible and ships under the "forge" mod id.
# The official NeoForge 1.20.1 MDK builds against net.minecraftforge:forge:1.20.1-47.1.3;
# the resulting mod runs on both Forge 47.1.3+ and NeoForge 47.1.x (up to 47.1.106).
forge_version=47.1.3
forge_version_range=[47.1.3,)
# FML loader version range for the javafml mod loader
loader_version_range=[47,)

## Mod properties

# Unique mod id; must match the @Mod annotation in the main class.
mod_id=mcthread
# Human-readable display name.
mod_name=MC Thread
# License; review options at https://choosealicense.com/
mod_license=All Rights Reserved
mod_version=0.1.0
# Base package for sources; also the Maven group when publishing.
mod_group_id=com.taolesi.mcthread
mod_authors=TaoLe-si
mod_description=A runtime-layer optimization mod for Minecraft 1.20.1 NeoForge.\nSeparates mod-game interaction from computation, provides profiling, snapshot-based offloading, and generic hot-path optimizations.\nNewline characters can be used and will be replaced properly.
