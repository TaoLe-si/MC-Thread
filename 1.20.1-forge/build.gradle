plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    // Use binary-only distribution (no sources attached to Gradle itself).
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Faster access to Maven Central in CN networks (used by JUnit etc.).
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // NeoForge 1.20.1 is published under the "forge" artifact id (Forge-compatible).
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations: client, dedicated server, game test server, data gen.
    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixin support for generic interaction-system optimizations (M3).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Optional local-only runtime dependencies (deobfuscated), not published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // Third-party mod dependencies are declared here, e.g.:
    // modCompileOnly "mezz.jei:jei-1.20.1-common-api:..."
    // modLocalRuntime "mezz.jei:jei-1.20.1-neoforge:..."

    // Unit tests for the pure-Java runtime primitives (run without a game instance).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft bundles slf4j at runtime, but the unit-test classpath needs it explicitly.
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    // Minecraft bundles Gson at runtime, but the unit-test classpath needs it explicitly.
    // Vendored in libs/ because the NeoForged Maven is unreachable from CN networks.
    testImplementation files('libs/gson-2.10.1.jar')

    // Mixin annotation processor (refmap generation). The SpongePowered Maven is
    // unreachable from CN networks, so the self-contained jars are vendored in libs/.
    annotationProcessor files('libs/mixin-0.8.5-processor.jar', 'libs/mixin-0.8.5.jar')
}

// JUnit 5 for unit tests.
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Expands ${...} placeholders in src/main/templates into build/generated sources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// Optional: publish a dev artifact to ./repo so other mods can compile against the API.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Official Forge 47.x discovers Mixins from the jar manifest, not [[mixins]] in mods.toml.
tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': 'mcthread.mixins.json')
    }
}

// Convenience: copy the built jar into a game mods folder.
// Usage: gradlew copyToMods -PmodsDir=D:\path\to\.minecraft\mods
tasks.register('copyToMods', Copy) {
    group = 'modpack'
    description = 'Copies the built jar into a game mods folder (-PmodsDir=...)'
    dependsOn 'reobfJar'
    from layout.buildDirectory.dir('libs')
    include '*.jar'
    def dir = providers.gradleProperty('modsDir')
    into dir
    onlyIf { dir.isPresent() }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
