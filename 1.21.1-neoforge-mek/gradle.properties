# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Java 21 toolchain (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Environment (matches the parent Thread Tearer build)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

## Mod properties

mod_id=threadtearer_mek
mod_name=Thread Tearer — Mek
mod_license=All Rights Reserved
mod_version=0.3.9
mod_group_id=com.taolesi.threadtearer.mek
mod_authors=TaoLe-si
mod_description=Addon for Thread Tearer: relocates Mekanism recipe, factory and chemical machine block-entity ticks onto the Thread Tearer compute pool. Requires Thread Tearer 0.3.0+ and Mekanism 1.21.x.

# The Thread Tearer core to depend on (consumed via mavenLocal).
threadtearer_version=0.3.0

# Mekanism jars used as compileOnly so the mixins can name return types
# (HeatTransfer, TransitResponse) that the Mekanism API declares. The addon
# has never bundled Mekanism at runtime — it stays that way; the jars are only
# on the compile classpath. Runtime comes from the user's installed Mekanism
# mod, declared in neoforge.mods.toml.
mekanism_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/Mekanism-1.21.1-10.7.19.85.jar
mekanismgenerators_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/MekanismGenerators-1.21.1-10.7.19.85.jar