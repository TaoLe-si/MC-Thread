# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Java 21 toolchain (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Environment (matches the parent Thread Tearer build)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

## Mod properties

mod_id=threadtearer_eio
mod_name=Thread Tearer — EnderIO
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.taolesi.threadtearer.enderio
mod_authors=TaoLe-si
mod_description=Addon for Thread Tearer: relocates EnderIO crafting machines (Alloy Smelter, SAG Mill, Slicer, Vat, Soul Binder) onto the Thread Tearer compute pool. Requires Thread Tearer 0.3.0+ and EnderIO 9.x for 1.21.1.

# The Thread Tearer core to depend on (consumed via mavenLocal).
threadtearer_version=0.3.0

# EnderIO and EnderCore jars used as compileOnly so the mixins can name the
# return types of calls they wrap (EnderBlockEntity, MachineBlockEntity) and
# reference MachineInventory. The addon stays a thin mod — these jars are only
# on the compile classpath. Runtime comes from the user's installed EnderIO
# mod, declared in neoforge.mods.toml.
#
# Source: https://github.com/Team-EnderIO/EnderIO branch 1.21.1.
# The mixins target endercore's EnderBlockEntity.tick (the single chokepoint
# for all 39 EnderIO BEs) and EnderIO's MachineBlockEntity.distributeResources
# (the neighbour-IO half that gets batched back to the server thread).
#
# Set these to point at the EnderIO and EnderCore jars for your installed
# 1.21.1 build. In 9.x alphas they ship separately; in older 8.x they are
# inlined into the main enderio jar (no EnderCore on classpath). The source
# shapes assumed by the mixins correspond to 9.x.
enderio_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/enderio-8.2.11-beta.jar
# EnderCore is jarjar'd inside the main enderio-8.2.11-beta.jar for runtime;
# the extracted copy below is only on the compile classpath so it isn't
# double-loaded at runtime.
endercore_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/endercore-8.2.11-beta.jar