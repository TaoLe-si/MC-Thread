# Gradle JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Java 21 toolchain (Microsoft OpenJDK 21 LTS).
org.gradle.java.installations.paths=D:/java21

# Environment (matches the parent Thread Tearer build)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

## Mod properties

mod_id=threadtearer_mkx
mod_name=Thread Tearer — Mekanism Extras
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.taolesi.threadtearer.mekx
mod_authors=TaoLe-si
mod_description=Addon for Thread Tearer: relocates Mekanism Extras factory block-entity ticks onto the Thread Tearer compute pool. Requires Thread Tearer 0.3.0+, Mekanism 1.21.x, Mekanism Extras 1.21.1, and the Thread Tearer Mekanism addon (for the ejector defer).

# The Thread Tearer core to depend on (consumed via mavenLocal).
threadtearer_version=0.3.0

# Mekanism jar used as compileOnly so the mixin can reference
# TileEntityMekanism and TileComponentEjector. The addon has never bundled
# Mekanism at runtime — it stays that way; the jar is only on the compile
# classpath. Runtime comes from the user's installed Mekanism mod, declared
# in neoforge.mods.toml.
mekanism_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/Mekanism-1.21.1-10.7.19.85.jar

# Mekanism Extras jar used as compileOnly so the mixin can reference
# TileEntityExtra* factories in the allowlist. The addon has never bundled
# Mekanism Extras at runtime — runtime comes from the user's installed copy,
# declared in neoforge.mods.toml. The path points at the user's installed
# 1.21.1-1.4.0 jar (the addon's source link is github.com/lostmyself8/
# Mekanism-Extras-neoforge branch 1.21.1, which has a 1.3.0 dev cycle).
mekextras_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/mekanism_extras-1.21.1-1.4.0.jar

# mekmm (More Machines Mod) — separate add-on that the mekmm factory classes
# in MKX's allowlist depend on. compileOnly so the chain annotations resolve.
mekmm_compile_jar=E:/MC/.minecraft/versions/NAST hard d0.9.1 beta3/mods/mekmm-1.21.1-1.3.3.jar